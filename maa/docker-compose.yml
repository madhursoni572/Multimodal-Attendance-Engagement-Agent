services:
  api:
    build: .
    ports: ["8000:8000"]
    environment: [GROQ_API_KEY=${GROQ_API_KEY:-}, DATA_DIR=/data]
    volumes: [data:/data]
  dashboard:
    build: .
    command: streamlit run dashboard/dashboard.py --server.port 8501 --server.address 0.0.0.0
    environment: [API_URL=http://api:8000]
    ports: ["8501:8501"]
    depends_on: [api]
volumes: {data: {}}
